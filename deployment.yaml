apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-native
  namespace: gajendra
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1             
      maxUnavailable: 0 
  selector:
    matchLabels:
      app: cloud-native
  template:
    metadata:
      labels:
        app: cloud-native
    spec:
      containers:
      - name: cloud-native
        image: gajendra1/cloud-native:latest 
        ports:
        - containerPort: 5000
        
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: gajendra
spec:
  type: NodePort
  selector:
    app: cloud-native
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30007