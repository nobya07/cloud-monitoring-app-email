<!DOCTYPE html>
<html>
<head>
    <title>Cloud Monitoring Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<meta http-equiv="refresh" content="5">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#141E30,#243B55);
    height: 100vh;
    color: white;
}

.container {
    text-align: center;
    padding-top: 20px;
}

h1 {
    letter-spacing: 2px;
}

.dashboard {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 40px;
    flex-wrap: wrap;
}

.card {
    width: 300px;
    height: 260px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    padding: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

.info-panel {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
}

.info-box {
    width: 250px;
    padding: 15px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    text-align: left;
    font-size: 15px;
}
</style>
</head>

<body>

<div class="container">
    <h1>🚀 Cloud Monitoring Dashboard</h1>

<div class="dashboard">

<div class="card">
<div id="cpu-gauge"></div>
</div>

<div class="card">
<div id="mem-gauge"></div>
</div>

<div class="card">
<div id="disk-gauge"></div>
</div>

</div>

<div class="info-panel">

<div class="info-box">
<b>Pod Status:</b> {{ pod_status }}
</div>

<div class="info-box">
<b>Restart Count:</b> {{ restart }}
</div>

<div class="info-box">
<b>Node Status:</b> {{ node }}
</div>

<div class="info-box">
<b>System Uptime:</b> {{ uptime }}
</div>

<div class="info-box">
<b>Network Sent:</b> {{ bytes_sent }} MB
</div>

<div class="info-box">
<b>Network Received:</b> {{ bytes_recv }} MB
</div>

</div>

</div>

<script>

var cpuGauge = {
    type: "indicator",
    mode: "gauge+number",
    value: {{ cpu_metric }},
    title: { text: "CPU Usage" },
    gauge: {
        axis: { range: [0,100] },
        steps: [
            { range: [0,50], color: "green" },
            { range: [50,80], color: "yellow" },
            { range: [80,100], color: "red" }
        ]
    }
};

var memGauge = {
    type: "indicator",
    mode: "gauge+number",
    value: {{ mem_metric }},
    title: { text: "Memory Usage" },
    gauge: {
        axis: { range: [0,100] },
        steps: [
            { range: [0,50], color: "green" },
            { range: [50,80], color: "yellow" },
            { range: [80,100], color: "red" }
        ]
    }
};

var diskGauge = {
    type: "indicator",
    mode: "gauge+number",
    value: {{ disk_metric }},
    title: { text: "Disk Usage" },
    gauge: {
        axis: { range: [0,100] },
        steps: [
            { range: [0,50], color: "green" },
            { range: [50,80], color: "yellow" },
            { range: [80,100], color: "red" }
        ]
    }
};

var layout = {
    width: 250,
    height: 200,
    margin: { t: 0, b: 0 },
    paper_bgcolor: "rgba(0,0,0,0)"
};

Plotly.newPlot('cpu-gauge', [cpuGauge], layout);
Plotly.newPlot('mem-gauge', [memGauge], layout);
Plotly.newPlot('disk-gauge', [diskGauge], layout);

</script>

</body>
</html>
